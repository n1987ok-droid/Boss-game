button{padding:7px; border-radius:8px; border:none; font-weight:bold; width:100%; margin-top:4px}

let idx = parseInt(localStorage.getItem('d_idx')||0);
let coins = parseInt(localStorage.getItem('d_coins')||0);
let dmg = parseInt(localStorage.getItem('d_dmg')||1);
let curHP = parseInt(localStorage.getItem('d_hp')||bosses[0].hp);
let bought = JSON.parse(localStorage.getItem('d_bought')||'[]');
let level = parseInt(localStorage.getItem('d_lv')||1);
let exp = parseInt(localStorage.getItem('d_exp')||0);
let loop = parseInt(localStorage.getItem('d_loop')||1);
let expNeed = level*100;

function render(){
  let b=bosses[idx]; let multi=Math.pow(1.7, loop-1); let realMax=Math.floor(b.hp*multi);
  document.getElementById('bossName').innerText=b.name;
  document.getElementById('bossTime').innerText=`🕐 ${b.time} | ${Math.floor(b.coin*multi).toLocaleString()} เหรียญ`;
  document.getElementById('boss').innerText=b.emoji;
  document.getElementById('coins').innerText=coins.toLocaleString();
  document.getElementById('dmg').innerText=dmg.toLocaleString();
  document.getElementById('level').innerText=level;
  document.getElementById('exp').innerText=`${exp}/${expNeed}`;
  document.getElementById('loop').innerText=loop;
  document.getElementById('hpText').innerText=`HP ${curHP.toLocaleString()} / ${realMax.toLocaleString()}`;
  document.getElementById('hpFill').style.width=(curHP/realMax*100)+'%';
  let sHtml='';
  shopItems.forEach((it,i)=>{
    let isBought=bought.includes(i); let locked=level<it.lv;
    sHtml+=`<div class="item ${locked? 'locked':''}"><div>${it.emoji} <b>${it.name}</b></div><div>+${it.dmg.toLocaleString()}</div><div class="price">${it.price.toLocaleString()}</div><div class="req">${isBought? 'ซื้อแล้ว ✅' : `เวล ${it.lv}`}</div><button class="${isBought||locked? 'cant':'buy'}" onclick="buy(${i})" ${isBought||locked? 'disabled':''}>${isBought? 'แล้ว': locked? 'ล็อค':'ซื้อ'}</button></div>`;
  });
  document.getElementById('shop').innerHTML=sHtml;
  localStorage.setItem('d_idx', idx); localStorage.setItem('d_coins', coins);
  localStorage.setItem('d_dmg', dmg); localStorage.setItem('d_hp', curHP);
  localStorage.setItem('d_bought', JSON.stringify(bought));
  localStorage.setItem('d_lv', level); localStorage.setItem('d_exp', exp); localStorage.setItem('d_loop', loop);
}
function hit(){ curHP-=dmg; if(curHP<=0){ let multi=Math.pow(1.7, loop-1); coins+=Math.floor(bosses[idx].coin*multi); exp+=Math.floor(bosses[idx].exp*multi); while(exp>=expNeed){ exp-=expNeed; level++; expNeed=level*100; alert(`เลเวลอัพ! ${level}`);} idx++; if(idx>=bosses.length){ loop++; idx=0; alert(`ครบ 24 ชม. รอบ ${loop}!`);} curHP=Math.floor(bosses[idx].hp*Math.pow(1.7, loop-1));} render();}
function buy(i){ if(level<shopItems[i].lv) return alert(`เวล ${shopItems[i].lv}`); if(bought.includes(i)) return; if(coins>=shopItems[i].price){ coins-=shopItems[i].price; dmg+=shopItems[i].dmg; bought.push(i); render();} else alert('เหรียญไม่พอ!');}
